name: Release

# Pushing a version tag (v1.2.3) builds and tests the package, publishes it to
# npm and creates a GitHub release with generated notes. Create the tag with
# `npm version <patch|minor|major>` followed by `git push --follow-tags`.
#
# npm authentication: either configure npm "trusted publishing" for this
# repository and workflow on npmjs.com (no secret needed; uses the OIDC token
# below), or add an automation token as the NPM_TOKEN repository secret.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the release
  id-token: write   # npm provenance / trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm >= 11.5; Node 22 bundles npm 10.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check tag matches package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}" >&2
            exit 1
          fi
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # With trusted publishing configured on npmjs.com, npm exchanges the
        # workflow's OIDC token itself and no secret is needed. If NPM_TOKEN is
        # set it is used instead.
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          fi
          npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
