<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fire-glass-button demo</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0b0d12; color: #dfe6f3; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 120px; }
  h1 { font-weight: 500; letter-spacing: -0.01em; margin: 0 0 4px; }
  h2 { font-weight: 500; font-size: 15px; color: #8e9ab0; text-transform: uppercase; letter-spacing: 0.08em; margin: 64px 0 20px; }
  p.lede { color: #8e9ab0; margin: 0 0 40px; }
  section.stage { display: grid; place-items: center; padding: 96px 24px 140px; background: #0b0d12; border-radius: 20px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 72px 48px; padding: 72px 24px 120px; }
  fire-glass-button { font-size: 56px; }
  fire-glass-button.l { font-size: 40px; }
  fire-glass-button.m { font-size: 28px; }
  fire-glass-button.s { font-size: 20px; }
  .mobile-frame { width: 390px; max-width: 100%; padding: 64px 20px 120px; box-sizing: border-box; border: 1px solid #1d2230; border-radius: 28px; }
  .mobile-frame fire-glass-button { width: 100%; font-size: 22px; }
</style>
</head>
<body>
<main>
  <h1>fire-glass-button</h1>
  <p class="lede">Photorealistic glass pill with procedural fire, rendered in WebGL2.</p>

  <section id="hero" class="stage">
    <fire-glass-button id="hero-button">Take Action →</fire-glass-button>
  </section>

  <h2>Sizes</h2>
  <section id="sizes" class="row">
    <fire-glass-button class="l">Take Action →</fire-glass-button>
    <fire-glass-button class="m">Take Action →</fire-glass-button>
    <fire-glass-button class="s">Take Action →</fire-glass-button>
  </section>

  <h2>Mobile width</h2>
  <section id="mobile" class="mobile-frame">
    <fire-glass-button>Take Action →</fire-glass-button>
  </section>
</main>
<script type="module" src="../dist/fire-glass-button.js"></script>
</body>
</html>
